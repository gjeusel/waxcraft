fail_fast: false

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: stylua-check
        name: stylua --check (nvim config)
        language: system
        entry: stylua --check nvim/
        files: ^nvim/.*\.lua$
        pass_filenames: false
      - id: oxfmt
        name: oxfmt (pi agent config)
        language: system
        entry: oxfmt
        files: ^dotfiles/pi/.*\.(ts|tsx|js|jsx|mts|cts|mjs|cjs)$
