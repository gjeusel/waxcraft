# ---- NOTES ----

# # https://blog.jpalardy.com/posts/tmux-synchronized-panes/
# bind-key -n y setw synchronize-panes
# # to detach a specific pane:
# # :select-pane -d
# # to attach it back:
# # :select-pane -e


# ---- MAP / REMAP ----
unbind C-b
set -g prefix C-q  # remap prefix to Control + q
bind-key -T prefix C-q send-prefix

bind-key e split-window -h -c "#{pane_current_path}"  # split pane horizontal
bind-key r split-window -v -c "#{pane_current_path}"  # split pane vertical
bind-key -T prefix C-Space copy-mode

unbind-key '['  # unbind classic copy mode enter
unbind-key ']'
unbind-key -T prefix C-\\

bind-key space copy-mode  # Bind escape to copy mode

# style pane background when synchronized:
setw -g window-status-current-format '#{?pane_synchronized,#[bg=red],}#I:#W'
setw -g window-status-format         '#{?pane_synchronized,#[bg=red],}#I:#W'

set-option -g renumber-windows on

# ---- UI CONF ----
set-option -g status-position top          # status bar at top
set -g base-index 1                        # Start window numbering at 1 (default => 0)
set-option -g default-shell $SHELL         # make sure to open default shell
set-window-option -g automatic-rename off  # do not auto rename windows
set-option -g set-titles on                # Add title to session
set -g mouse on                            # activate mouse

# Enable VI mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Neovim advices:
set-option -sg escape-time 0   # fast send-keys
set -g default-terminal "tmux-256color"
# set-option -sa terminal-overrides ',XXX:RGB'
# set-option -ga terminal-overrides ",xterm-256color:Tc"

# ---- Extended keys (CSI u) ----
# "on" = opt-in: only apps that request the protocol (nvim, pi, claude code)
# receive CSI u encodings — zsh/fzf/less keep classic key codes. Never use
# "always", it forces the encoding on non-aware apps.
# Enables ctrl+shift+* combos, shift+enter, and ctrl+h vs backspace
# disambiguation inside tmux.
set -g extended-keys on
set -g extended-keys-format csi-u
# tmux also needs to know the OUTER terminal supports extended keys;
# neither tmux-256color nor screen-256color terminfo advertises it.
set -as terminal-features ',xterm-ghostty:extkeys,alacritty:extkeys'


# --- ColorScheme ---
set-option -g status-style fg=yellow,bg=black
set-window-option -g window-status-style fg=brightblue,bg=default
set-window-option -g window-status-current-style fg=brightred,bg=default
set-option -g pane-border-style fg=black
set-option -g pane-active-border-style fg=brightgreen
set-option -g message-style fg=brightred,bg=black
set-option -g display-panes-active-colour brightred
set-option -g display-panes-colour blue
set-window-option -g clock-mode-colour green
set-window-option -g window-status-bell-style fg=black,bg=red


# ---- List of plugins ----
# to be installed: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'                # tmux plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'      # better default configs
set -g @plugin 'christoomey/vim-tmux-navigator'  # navigate accross panes with vim bindings
set -g @plugin 'nhdaly/tmux-better-mouse-mode'   # better manage the mouse

set -g @plugin 'tmux-plugins/tmux-yank'  # get clipboard integration
set -g @yank_action 'copy-pipe'          # don't leave copy mode copy-pipe-and-cancel' for the default


set -g @plugin 'fcsonline/tmux-thumbs'  # search on regex with rust
set -g @thumbs-key f
set -g @thumbs-reverse enabled
set -g @thumbs-unique enabled
set -g @thumbs-position off_right
set -g @thumbs-contrast 0

# Custom regexes (rust regex syntax, test with `rg -o`): evaluated BEFORE the
# built-in patterns and in numeric order — earliest match in the line wins and
# consumes, so urls/db-uris must come before the file regex or it eats their
# tails.
# 
# Additional thumbs regex:  https://rustexp.lpil.uk/
#
# The built-in "path" pattern still catches extensionless paths
# (~/src/waxcraft/justfile) but drops :line/::test suffixes and needs a "/" —
# regexp-3 fixes both for files with known extensions (package.json, models.py:123:4, tests/x.py::test_foo).
# Extension alternation is longest-first on purpose: `c` before `conf` would truncate ".tmux.conf".
set -g @thumbs-regexp-1 'https?://\S+'                                     # urls
set -g @thumbs-regexp-2 '(?:postgres(?:ql)?|redis|cockroach)://\S*' # db uris
set -g @thumbs-regexp-3 '(?:[\w.~$@-]*/)*[\w.$@-]+\.(?:tsx|ts|mjs|cjs|jsonc|json|jsx|js|vue|lua|py|rs|go|cpp|hpp|md|rst|toml|ya?ml|csv|xlsx|xls|txt|log|zsh|bash|sh|sql|conf|ini|lock|html|htm|css|scss|svg|png|jpeg|jpg|pdf|c|h)(?:(?:::\w+)+|(?::\d+(?::\d+)?))?' # files w/ optional :line(:col) or ::testid
# (?P<match>...) named group = only that part is copied, not "def "/"("
set -g @thumbs-regexp-4 'def (?P<match>test\w+)\('                         # python test names

# Styling — hex RGB supported (Nord palette, matches the rest of the setup)
set -g @thumbs-fg-color '#88C0D0'        # matched text
set -g @thumbs-bg-color default
set -g @thumbs-hint-fg-color '#2E3440'   # hint letters: dark on yellow
set -g @thumbs-hint-bg-color '#EBCB8B'
set -g @thumbs-select-fg-color '#A3BE8C' # flash on pick
set -g @thumbs-select-bg-color default
set -g @thumbs-multi-fg-color '#B48EAD'  # multi-select mode
set -g @thumbs-multi-bg-color default

set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'tmux set-buffer {} && tmux paste-buffer && echo -n {} | pbcopy'

# status right setup
set -g @plugin 'jonmosco/kube-tmux'                  # kube context prompt
set -g @plugin 'tmux-plugins/tmux-cpu'               # cpu infos
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'  # highlight on prefix

set -g @prefix_highlight_fg 'blue'
set -g @prefix_highlight_bg 'default'
set -g status-right "#{prefix_highlight} #{cpu_icon} #(/bin/bash $HOME/.tmux/plugins/kube-tmux/kube.tmux 250 red cyan)"

# Prevent mouse wheel over the status bar from switching windows
unbind -n WheelUpStatus
unbind -n WheelDownStatus

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

