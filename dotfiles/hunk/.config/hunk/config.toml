# hunk — terminal diff viewer (https://github.com/modem-dev/hunk)
# Config search path: ~/.config/hunk/config.toml  or  .hunk/config.toml (per-repo)

theme = "nord"                       # built-in theme id, "auto", or "custom"
mode = "auto"                        # auto | split | unified  (auto = responsive)
auto_split_min_width = 130           # min diff columns (after panes) for split in auto mode
vcs = "git"                          # git | jj | sl  (overrides auto-detection)
watch = true                         # auto-reload when the diff input changes
exclude_untracked = false            # hide untracked files in working-tree reviews
line_numbers = true                  # show line numbers
cursor_line = "number"               # mark the active line in the line-number column
hunk_gap = 1                         # add a blank row between consecutive hunks
wrap_lines = false                   # wrap (true) or truncate (false) long lines
menu_bar = false                     # hide the menu bar until toggled with M
agent_notes = true                   # show inline agent/AI notes by default
color_moved = true                   # highlight moved lines when supported
transparent_background = true        # let the terminal background show through
prompt_save_view_preferences = false

# Loaded from the repository rather than stowed into ~/.config/hunk/extensions: Stow links each
# file, and Hunk 0.24.1 cannot serve its React to an extension entry that is a file symlink.
[extensions]
paths = ["~/src/waxcraft/hunk/extensions"]

[keybindings]
"hunk.review.stepDown" = ["j", "down", "ctrl+e"]
"hunk.review.stepUp" = ["k", "up", "ctrl+y"]
"hunk.review.halfPageDown" = "ctrl+d"
"hunk.review.halfPageUp" = "ctrl+u"
"hunk.review.pageDown" = ["ctrl+f", "pagedown"]
"hunk.review.pageUp" = ["ctrl+b", "pageup"]
"hunk.review.toggleHunkGap" = "z"
"hunk.review.previousFile" = [",", "ctrl+p"]
"hunk.review.nextFile" = [".", "ctrl+n"]
"hunk.review.previousAnnotatedHunk" = "{"
"hunk.review.nextAnnotatedHunk" = "}"
# extensions/viewed-hunks: built-ins keep their default chords unless rebound here.
"viewed-hunks.toggle-hunk" = ["x", "space"]
"viewed-hunks.toggle-file" = ["X", "shift+space"]
"viewed-hunks.next-unviewed" = ">"
"viewed-hunks.previous-unviewed" = "<"
"viewed-hunks.toggle-hidden" = "H"

# ─────────────────────────────────────────────────────────────────────────────
# CHEATSHEET — press `?` in the app for this overlay, `F10` to open the menu bar.
#
# Navigation
#   ↑ / ↓, k / j, Ctrl+Y / Ctrl+E   move line-by-line
#   Ctrl+B / Ctrl+F, PgUp / PgDn    page up / down
#   Ctrl+U / Ctrl+D                 half page up / down
#   [ / ]                           previous / next hunk
#   , / ., Ctrl+P / Ctrl+N          previous / next file
#   { / }                           previous / next comment
#   n / N                           next / previous search match
#   ← / →                           scroll code left / right  (Shift = faster)
#   Home / End     jump to top / bottom
#   g / G          jump to top / bottom (less-style)
#
# Mouse
#   Wheel          scroll vertically
#   Shift+Wheel    scroll code horizontally
#
# View
#   1 / 2 / 0      layout: split / stack / auto
#   s             toggle sidebar (file list)
#   t             open theme selector
#   a             toggle AI / agent notes
#   z             toggle unchanged context lines
#   l / w / m     toggle line numbers / wrap / hunk metadata
#   e             open current file in $EDITOR
#
# Review
#   /             search diff content
#   c             create a review note
#   x / Space     mark the current hunk viewed (hides it; hunk jumps skip it)
#   X / Shift+Space   mark the whole current file viewed / unviewed
#   > / <         next / previous unviewed hunk, wrapping
#   H             show (dimmed) or hide the viewed hunks
#   (viewed marks persist in ~/.local/state/hunk/viewed-hunks.json; clear them from the
#    Extensions menu, F10)
#   Tab           toggle focus between files list / filter
#   F10           open menus
#   r             reload   (when refreshable)
#   q             quit
#   ?             toggle this help overlay
# ─────────────────────────────────────────────────────────────────────────────
