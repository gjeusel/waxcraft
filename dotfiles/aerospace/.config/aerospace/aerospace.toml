start-at-login = true

after-login-command = []

# The default root layout below already initializes workspaces as horizontal accordions.
# Avoid switching through every workspace and resetting layouts at each startup.
after-startup-command = []

# Hammerspoon pulls floating windows of the newly focused workspace back on screen.
# Apps that manage their own frame defeat AeroSpace's hide-in-corner restore (see init.lua).
exec-on-workspace-change = ['/usr/bin/open', '-g', 'hammerspoon://rescue-offscreen-windows']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0

default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 0
outer.left = 0
outer.right = 0
outer.bottom = 0
outer.top = 0


# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift
# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

[mode.main.binding]

# Disable cmd-h (hide application) - prevents accidental hiding in tiling context
cmd-h = []
cmd-alt-h = []

# Disable cmd-m (minimize window) - minimized windows break tiling
cmd-m = []

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
ctrl-alt-d = 'layout v_accordion h_tiles'
ctrl-alt-f = 'layout tiling floating'
ctrl-alt-r = ['flatten-workspace-tree', 'balance-sizes']
ctrl-alt-c = 'reload-config'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus --ignore-floating left'
alt-j = 'focus --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors down'
# alt-k = 'focus --ignore-floating --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors up'
alt-k = 'focus-back-and-forth'
alt-l = 'focus --ignore-floating right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
ctrl-0 = 'workspace 0'
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
# Keep focus on the moved window instead of silently selecting the window underneath.
alt-ctrl-0 = 'move-node-to-workspace --focus-follows-window 0'
alt-ctrl-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-ctrl-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-ctrl-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-ctrl-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-ctrl-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-ctrl-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-ctrl-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-ctrl-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-ctrl-9 = 'move-node-to-workspace --focus-follows-window 9'

# Cycle actual windows on this workspace, including floating popups. Cmd-Tab switches apps.
alt-tab = 'focus --wrap-around dfs-next'
alt-shift-tab = 'focus --wrap-around dfs-prev'


