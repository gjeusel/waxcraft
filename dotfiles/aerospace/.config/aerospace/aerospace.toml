# The main window must win over call keywords in channel names and floating-popup detection.
# Hammerspoon separately undoes Slack's automatic minimization while screen sharing.
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
if.window-title-regex-substring = '- Slack \[(principal|main)\]$'
run = ['layout tiling', 'move-node-to-workspace 4']

# Send Slack floating popups to workspace 0, even when their titles lack call/share keywords.
[[on-window-detected]]
if = '''test %{app-bundle-id} = com.tinyspeck.slackmacgap && test %{window-layout} = floating'''
run = ['layout floating', 'move-node-to-workspace 0']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
if.window-title-regex-substring = 'Appel|Huddle|Call|🎤|Screen.?shar|Shar(e|ing).*screen|Partage.*écran'
run = ['layout floating', 'move-node-to-workspace 0']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 4'

# Keep Teams dialogs and call/share windows floating on their opening workspace.
[[on-window-detected]]
if = '''test %{app-bundle-id} = com.microsoft.teams2 && test %{window-layout} = floating'''
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
if.window-title-regex-substring = 'Meeting|Call|Appel|Réunion|Screen.?shar|Shar(e|ing).*screen|Partage.*écran'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 4'


# Keep Zoom's main window on 4, even if AeroSpace initially recognizes it as floating.
[[on-window-detected]]
if.app-id = 'us.zoom.xos'
if.window-title-regex-substring = '^(Zoom Workplace|Zoom|zoom\.us)$'
run = 'move-node-to-workspace 4'

# Call windows and controls must precede Zoom's general workspace routing.
# Toolbars that AeroSpace does not manage cannot be moved by these callbacks.
